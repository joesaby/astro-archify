[build]
  command = "cd .. && npm install && cd astro-demo && npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN (not DENY): astro-archify embeds each diagram's own
    # /_archify/*.html artifact in a same-origin <iframe> on the page that
    # references it. DENY blocks that embed even though it's same-origin —
    # the diagram silently fails to render while "Open full view" (a
    # top-level navigation, unaffected by X-Frame-Options) still works.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_archify/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
